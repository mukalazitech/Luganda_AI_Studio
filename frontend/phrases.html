<style>.page{max-width:980px;margin:auto;padding:40px 24px 54px}.head{margin-bottom:26px}.kicker{color:var(--lime);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}.head h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;margin:8px 0 12px;letter-spacing:-.045em}.head p{max-width:640px;color:var(--text-secondary);line-height:1.6}.topic-list{display:grid;gap:14px}.topic{border:1px solid var(--border);border-radius:18px;background:var(--bg-card);box-shadow:var(--shadow-card);overflow:hidden}.topic>summary{min-height:56px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;font-weight:800;list-style:none}.topic>summary::-webkit-details-marker{display:none}.topic>summary::after{content:'+';font-size:1.35rem;color:var(--lime)}.topic[open]>summary::after{content:'−'}.topic>summary:focus-visible{outline:3px solid var(--lime-glow);outline-offset:-4px}.topic-count{font-size:.78rem;color:var(--text-muted);font-weight:600}.topic-body{border-top:1px solid var(--border)}.phrase{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border)}.phrase:last-child{border-bottom:0}.luganda{font:800 1.12rem/1.4 var(--font-display);margin:0 0 4px;overflow-wrap:anywhere}.english{margin:0;color:var(--text-secondary);line-height:1.45}.listen{min-height:44px;align-self:start;white-space:nowrap}.listen[disabled]{cursor:not-allowed;opacity:.55}.notes{grid-column:1/-1}.notes summary{min-height:44px;display:flex;align-items:center;color:var(--lime);cursor:pointer;font-size:.9rem;font-weight:700}.notes p{margin:0 0 5px;padding:10px 13px;border-radius:10px;background:var(--lime-bg);color:var(--text-secondary);line-height:1.5}.state{padding:36px 20px;border:1px dashed var(--border);background:var(--bg-card);border-radius:18px;text-align:center;color:var(--text-secondary)}.state[hidden]{display:none}@media(max-width:680px){.page{padding:28px 16px 108px}.phrase{grid-template-columns:1fr}.listen{justify-self:start}.notes{grid-column:1}}</style></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand">Luganda <span>AI</span></div><nav class="sidebar-nav"><a href="index.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-home"></use></svg>Home</a><a href="translate.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-translate"></use></svg>Translate</a><a href="learn.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-learn"></use></svg>Learn</a><a href="explore.html" class="sidebar-link active" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-explore"></use></svg>Explore</a><a href="search.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-search"></use></svg>Search</a><a href="chat.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-chat"></use></svg>Chat</a></nav><div class="sidebar-footer"><div class="theme-pill"><button class="theme-pill-btn" id="btnLight" onclick="setTheme('light')">☀ Light</button><button class="theme-pill-btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button></div><div class="sidebar-version">v1.1 · Luganda AI Studio</div></div></aside><header class="mobile-topbar"><span class="mobile-topbar-title">Phrases</span><button class="theme-icon-btn" id="mobileThemeBtn" onclick="toggleTheme()" aria-label="Switch theme">☀</button></header><main class="main-content"><div class="page"><header class="head"><div class="kicker"><a href="explore.html">Explore</a> · Ebigambo</div><h1>Everyday phrases</h1><p>Open a topic, listen to the Luganda, and keep the phrases you need close at hand.</p></header><div class="state" id="state" role="status">Loading phrases…</div><div class="topic-list" id="topics"></div></div></main></div>

<script>
let currentAudio=null;let currentObjectUrl=null;let currentButton=null;let pendingButton=null;let ttsController=null;let ttsRequestId=0;
function normalizeTopic(topic){return String(topic||'Other').trim().toLowerCase()||'other'}
function topicLabel(topic){return topic.replace(/_/g,' ').replace(/\b\w/g,char=>char.toUpperCase())}
function stopAudio(restoreButton=true){if(currentAudio){currentAudio.pause();currentAudio=null}if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}if(currentButton&&restoreButton){currentButton.disabled=false;currentButton.removeAttribute('aria-busy')}currentButton=null}
async function playPhrase(text,button){const requestId=++ttsRequestId;if(ttsController)ttsController.abort();if(pendingButton&&pendingButton!==button){pendingButton.disabled=false;pendingButton.removeAttribute('aria-busy')}pendingButton=button;stopAudio();button.disabled=true;button.setAttribute('aria-busy','true');const controller=new AbortController();ttsController=controller;try{const response=await fetch('/api/v1/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,lang:'lug'}),signal:controller.signal});if(requestId!==ttsRequestId)return;if(!response.ok){button.title='Audio unavailable';button.setAttribute('aria-label',`${text}: Audio unavailable`);return}const blob=await response.blob();if(requestId!==ttsRequestId)return;currentButton=button;pendingButton=null;currentObjectUrl=URL.createObjectURL(blob);currentAudio=new Audio(currentObjectUrl);currentAudio.addEventListener('ended',()=>{if(requestId===ttsRequestId&&currentButton===button)stopAudio()},{once:true});currentAudio.addEventListener('error',()=>{if(requestId!==ttsRequestId)return;button.disabled=true;button.title='Audio unavailable';button.setAttribute('aria-label',`${text}: Audio unavailable`);stopAudio(false)},{once:true});await currentAudio.play()}catch(error){if(requestId!==ttsRequestId)return;button.disabled=true;button.title='Audio unavailable';button.setAttribute('aria-label',`${text}: Audio unavailable`);if(currentButton===button)stopAudio(false)}finally{if(requestId===ttsRequestId){button.removeAttribute('aria-busy');if(pendingButton===button)pendingButton=null;if(ttsController===controller)ttsController=null}}}
function renderPhrases(entries){const groups=new Map();entries.forEach(entry=>{const key=normalizeTopic(entry.topic);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(entry)});const root=document.getElementById('topics');root.replaceChildren();[...groups.entries()].sort(([a],[b])=>a.localeCompare(b)).forEach(([topic,items],index)=>{const section=document.createElement('details');section.className='topic';section.open=index===0;const summary=document.createElement('summary');const label=document.createElement('span');label.textContent=topicLabel(topic);const count=document.createElement('span');count.className='topic-count';count.textContent=`${items.length} phrase${items.length===1?'':'s'}`;summary.append(label,count);const body=document.createElement('div');body.className='topic-body';items.forEach(item=>{const row=document.createElement('article');row.className='phrase';const text=document.createElement('div');const luganda=document.createElement('h2');luganda.className='luganda';luganda.textContent=String(item.luganda||'');const english=document.createElement('p');english.className='english';english.textContent=String(item.english||'');text.append(luganda,english);const listen=document.createElement('button');listen.type='button';listen.className='btn-secondary listen';listen.textContent='🔊 Listen';listen.setAttribute('aria-label',`Listen to ${String(item.luganda||'phrase')}`);listen.addEventListener('click',()=>playPhrase(String(item.luganda||''),listen));row.append(text,listen);if(item.notes){const notes=document.createElement('details');notes.className='notes';const noteSummary=document.createElement('summary');noteSummary.textContent='Notes';const noteText=document.createElement('p');noteText.textContent=String(item.notes);notes.append(noteSummary,noteText);row.append(notes)}body.append(row)});section.append(summary,body);root.append(section)})}
async function loadPhrases(){const state=document.getElementById('state');try{const response=await fetch('/api/v1/library/phrases');if(!response.ok)throw new Error('unavailable');const data=await response.json();const entries=Array.isArray(data.entries)?data.entries:[];if(!entries.length){state.textContent='No phrases are available yet.';return}state.hidden=true;renderPhrases(entries)}catch(error){state.textContent='Cannot load phrases. Check the app is running, then try again.'}}
window.addEventListener('pagehide',()=>{ttsRequestId++;if(ttsController)ttsController.abort();stopAudio()});loadPhrases();
</script></body></html>
