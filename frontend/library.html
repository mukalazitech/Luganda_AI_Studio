<style>.page{max-width:1020px;margin:auto;padding:40px 24px 54px}.head{margin-bottom:20px}.kicker{color:var(--lime);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.head h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;margin:8px 0 12px;letter-spacing:-.045em}.head p{max-width:650px;color:var(--text-secondary);line-height:1.6}.mode-row{display:flex;gap:8px;margin-bottom:16px}.mode-button{min-height:44px}.mode-button.active{background:var(--lime);border-color:var(--lime);color:var(--text-on-lime)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.back{min-height:44px}.search{flex:1;min-width:0;min-height:48px;padding:0 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg-input);color:var(--text-primary);font:inherit}.search:focus-visible,.category:focus-visible,.back:focus-visible{outline:3px solid var(--lime-glow);outline-offset:2px}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.category{min-height:132px;border:1px solid var(--border);border-radius:18px;background:var(--bg-card);color:var(--text-primary);padding:18px;display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;text-align:left;cursor:pointer;box-shadow:var(--shadow-card)}.category:hover{border-color:var(--lime);transform:translateY(-2px)}.medallion{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card-medallion-bg);font-size:1.75rem}.category strong{display:block;font-size:1.05rem;margin-bottom:5px}.category small{color:var(--text-muted)}.word-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.word{min-width:0;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px}.word-head{display:flex;gap:10px;justify-content:space-between;align-items:start}.word h2{font-size:1.16rem;margin:0 0 4px;overflow-wrap:anywhere}.english{color:var(--text-secondary);margin:0;line-height:1.45}.pos{flex:none;background:var(--lime-bg);color:var(--lime);border-radius:999px;padding:4px 8px;font-size:.73rem;font-weight:800}.example{margin:14px 0 0;padding:11px 13px;background:var(--bg);border-radius:9px;color:var(--text-secondary);font-size:.9rem;line-height:1.5}.example strong{display:block;color:var(--text-primary)}.state{padding:36px 20px;border:1px dashed var(--border);background:var(--bg-card);border-radius:18px;text-align:center;color:var(--text-secondary)}.state[hidden],[hidden]{display:none!important}.show-more-wrap{display:flex;justify-content:center;margin-top:20px}.show-more{min-height:44px}@media(max-width:760px){.page{padding:28px 16px 108px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.word-list{grid-template-columns:1fr}}@media(max-width:430px){.toolbar{align-items:stretch;flex-direction:column}.mode-row{display:grid;grid-template-columns:1fr 1fr}.category-grid{grid-template-columns:1fr}.category{min-height:96px}}</style></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand">Luganda <span>AI</span></div><nav class="sidebar-nav"><a href="index.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-home"></use></svg>Home</a><a href="translate.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-translate"></use></svg>Translate</a><a href="learn.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-learn"></use></svg>Learn</a><a href="explore.html" class="sidebar-link active" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-explore"></use></svg>Explore</a><a href="search.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-search"></use></svg>Search</a><a href="chat.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-chat"></use></svg>Chat</a></nav><div class="sidebar-footer"><div class="theme-pill"><button class="theme-pill-btn" id="btnLight" onclick="setTheme('light')">☀ Light</button><button class="theme-pill-btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button></div><div class="sidebar-version">v1.1 · Luganda AI Studio</div></div></aside><header class="mobile-topbar"><span class="mobile-topbar-title">Word Library</span><button class="theme-icon-btn" id="mobileThemeBtn" onclick="toggleTheme()" aria-label="Switch theme">☀</button></header><main class="main-content"><div class="page"><header class="head"><div class="kicker"><a href="explore.html">Explore</a> · Ebigambo</div><h1>Word library</h1><p>Start with the curated learner set, or open the full dictionary when you need wider search.</p></header><div class="mode-row" aria-label="Choose a word collection"><button class="btn-secondary mode-button active" id="curatedMode" type="button">Curated words</button><button class="btn-secondary mode-button" id="fullMode" type="button">Full dictionary</button></div><div class="toolbar"><button class="btn-secondary back" id="backButton" type="button" hidden>← Back to categories</button><label class="sr-only" for="wordFilter">Search words</label><input class="search" id="wordFilter" type="search" placeholder="Search curated words…"/></div><div class="state" id="state" role="status">Loading word library…</div><div class="category-grid" id="categories"></div><div class="word-list" id="words" hidden></div><div class="show-more-wrap"><button class="btn-secondary show-more" id="wordShowMore" type="button" hidden>Show more words</button></div></div></main></div>
<nav class="bottom-nav"><div class="bottom-nav-inner"><a href="index.html" class="bnav-item" data-page="index"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-home"></use></svg><span class="bnav-label">Home</span></a><a href="translate.html" class="bnav-item" data-page="translate"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-translate"></use></svg><span class="bnav-label">Translate</span></a><a href="learn.html" class="bnav-item" data-page="learn"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-learn"></use></svg><span class="bnav-label">Learn</span></a><a href="explore.html" class="bnav-item active" data-page="explore" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-explore"></use></svg><span class="bnav-label">Explore</span></a></div></nav>
<script src="/app/category-icons.js"></script><script>
let vocabulary=[];
let activeCategory=null;
let activeTier='featured';
let visibleWordCount=60;
const WORD_PAGE_SIZE=60;

function text(value){return value==null?'':String(value)}
function searchable(item){return [item.luganda,item.english,item.part_of_speech,item.example_luganda,item.example_english].map(text).join(' ').toLowerCase()}
function currentVocabulary(){return activeTier==='featured'?vocabulary.filter(item=>item.tier==='featured'):vocabulary}

function setMode(tier){
 activeTier=tier;activeCategory=null;visibleWordCount=WORD_PAGE_SIZE;
 const curated=document.getElementById('curatedMode');const full=document.getElementById('fullMode');
 curated.classList.toggle('active',tier==='featured');full.classList.toggle('active',tier==='all');
 document.getElementById('wordFilter').value='';
 document.getElementById('wordFilter').placeholder=tier==='featured'?'Search curated words…':'Search the full dictionary…';
 document.getElementById('backButton').hidden=true;
 document.getElementById('words').hidden=true;
 document.getElementById('wordShowMore').hidden=true;
 document.getElementById('categories').hidden=false;
 document.getElementById('state').hidden=true;
 renderCategories();
}

function renderCategories(){
 const root=document.getElementById('categories');root.replaceChildren();const counts=new Map();
 currentVocabulary().forEach(item=>{const category=text(item.category).trim().toLowerCase()||'uncategorized';counts.set(category,(counts.get(category)||0)+1)});
 [...counts.entries()].sort(([a],[b])=>categoryLabel(a).localeCompare(categoryLabel(b))).forEach(([category,count])=>{
  const button=document.createElement('button');button.type='button';button.className='category';button.setAttribute('aria-label',`${categoryLabel(category)}, ${count} words`);
  const icon=document.createElement('span');icon.className='medallion';icon.setAttribute('aria-hidden','true');icon.textContent=categoryIcon(category);
  const copy=document.createElement('span');const title=document.createElement('strong');title.textContent=categoryLabel(category);
  const total=document.createElement('small');total.textContent=`${count} word${count===1?'':'s'}`;
  copy.append(title,total);button.append(icon,copy);button.addEventListener('click',()=>selectCategory(category));root.append(button)
 })
}

function buildWordCard(item){
 const card=document.createElement('article');card.className='word';const head=document.createElement('div');head.className='word-head';
 const pair=document.createElement('div');const luganda=document.createElement('h2');luganda.textContent=text(item.luganda);
 const english=document.createElement('p');english.className='english';english.textContent=text(item.english);pair.append(luganda,english);head.append(pair);
 if(item.part_of_speech){const pos=document.createElement('span');pos.className='pos';pos.textContent=text(item.part_of_speech);head.append(pos)}
 card.append(head);
 if(item.example_luganda||item.example_english){const example=document.createElement('p');example.className='example';const local=document.createElement('strong');local.textContent=text(item.example_luganda);const translated=document.createElement('span');translated.textContent=text(item.example_english);example.append(local,translated);card.append(example)}
 return card;
}

function renderWords(){
 const root=document.getElementById('words');root.replaceChildren();const query=document.getElementById('wordFilter').value.trim().toLowerCase();
 const selected=currentVocabulary().filter(item=>(activeCategory===null||(text(item.category).trim().toLowerCase()||'uncategorized')===activeCategory)&&(!query||searchable(item).includes(query)));
 selected.slice(0,visibleWordCount).forEach(item=>root.append(buildWordCard(item)));
 const state=document.getElementById('state');state.hidden=selected.length>0;if(!selected.length)state.textContent=query?'No words match this search.':'No words are available in this category yet.';
 document.getElementById('wordShowMore').hidden=selected.length<=visibleWordCount;
}

function selectCategory(category){
 sendEvent('item_opened',category);activeCategory=category;visibleWordCount=WORD_PAGE_SIZE;
 document.getElementById('categories').hidden=true;document.getElementById('words').hidden=false;document.getElementById('backButton').hidden=false;
 const filter=document.getElementById('wordFilter');filter.value='';filter.placeholder=`Filter ${categoryLabel(category)}…`;renderWords();filter.focus()
}

function showCategories(){
 activeCategory=null;visibleWordCount=WORD_PAGE_SIZE;document.getElementById('categories').hidden=false;document.getElementById('words').hidden=true;document.getElementById('backButton').hidden=true;
 const filter=document.getElementById('wordFilter');filter.value='';filter.placeholder=activeTier==='featured'?'Search curated words…':'Search the full dictionary…';
 document.getElementById('wordShowMore').hidden=true;document.getElementById('state').hidden=true
}

function handleWordSearch(){
 visibleWordCount=WORD_PAGE_SIZE;const query=document.getElementById('wordFilter').value.trim();
 if(activeCategory===null&&query){document.getElementById('categories').hidden=true;document.getElementById('words').hidden=false}
 else if(activeCategory===null&&!query){document.getElementById('categories').hidden=false;document.getElementById('words').hidden=true}
 renderWords();
}

async function loadLibrary(){const state=document.getElementById('state');try{const response=await fetch('/api/v1/library/vocabulary');if(!response.ok)throw new Error('unavailable');const data=await response.json();vocabulary=Array.isArray(data.entries)?data.entries:[];if(!vocabulary.length){state.textContent='No words are available yet.';return}state.hidden=true;renderCategories()}catch(error){state.textContent='Cannot load the word library. Check the app is running, then try again.'}}

document.getElementById('curatedMode').addEventListener('click',()=>setMode('featured'));
document.getElementById('fullMode').addEventListener('click',()=>setMode('all'));
document.getElementById('wordFilter').addEventListener('input',handleWordSearch);
document.getElementById('backButton').addEventListener('click',showCategories);
document.getElementById('wordShowMore').addEventListener('click',()=>{visibleWordCount+=WORD_PAGE_SIZE;renderWords()});
loadLibrary();
sendEvent('collection_opened','vocabulary');
</script></body></html>
