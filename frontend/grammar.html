<style>.page{max-width:980px;margin:auto;padding:40px 24px 54px}.head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:26px}.head h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;margin:7px 0 11px;letter-spacing:-.045em}.kicker{color:var(--lime);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}.head p{max-width:640px;color:var(--text-secondary);line-height:1.6;margin:0}.practice{min-height:44px}.sections{display:grid;gap:16px}.grammar-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow-card);min-width:0}.grammar-card h2{font-size:1.35rem;margin:0 0 8px}.intro{color:var(--text-secondary);line-height:1.55;margin:0 0 16px}.note{padding:12px 14px;background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:8px;color:var(--text-secondary)}.item-list,.nested-list{margin:0;padding-left:22px;display:grid;gap:8px}.definition{display:grid;grid-template-columns:minmax(110px,.34fr) minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--border)}.definition dt{font-weight:800;overflow-wrap:anywhere}.definition dd{margin:0;color:var(--text-secondary);min-width:0;overflow-wrap:anywhere}.nested-group{display:grid;gap:8px}.nested-label{font-weight:800}.state{padding:36px 20px;border:1px dashed var(--border);background:var(--bg-card);border-radius:18px;text-align:center;color:var(--text-secondary)}.state[hidden]{display:none}@media(max-width:680px){.page{padding:28px 16px 108px}.head{grid-template-columns:1fr}.practice{justify-self:start}.definition{grid-template-columns:1fr;gap:4px}}</style></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand">Luganda <span>AI</span></div><nav class="sidebar-nav"><a href="index.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-home"></use></svg>Home</a><a href="translate.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-translate"></use></svg>Translate</a><a href="learn.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-learn"></use></svg>Learn</a><a href="explore.html" class="sidebar-link active" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-explore"></use></svg>Explore</a><a href="search.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-search"></use></svg>Search</a><a href="chat.html" class="sidebar-link"><svg class="icon" aria-hidden="true"><use href="/app/assets/icons.svg#icon-chat"></use></svg>Chat</a></nav><div class="sidebar-footer"><div class="theme-pill"><button class="theme-pill-btn" id="btnLight" onclick="setTheme('light')">☀ Light</button><button class="theme-pill-btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button></div><div class="sidebar-version">v1.1 · Luganda AI Studio</div></div></aside><header class="mobile-topbar"><span class="mobile-topbar-title">Grammar</span><button class="theme-icon-btn" id="mobileThemeBtn" onclick="toggleTheme()" aria-label="Switch theme">☀</button></header><main class="main-content"><div class="page"><header class="head"><div><div class="kicker"><a href="explore.html">Explore</a> · Empandiika</div><h1>Grammar patterns</h1><p>Read each pattern at your own pace, then take the words into a practice session.</p></div><a class="btn-primary practice" href="teach.html">Practice these words</a></header><div class="state" id="state" role="status">Loading grammar…</div><div class="sections" id="sections"></div></div></main></div>

<script>
function labelFor(key){return String(key).replace(/_/g,' ').replace(/\b\w/g,char=>char.toUpperCase())}
function primitive(value){return value===null||['string','number','boolean'].includes(typeof value)}
function renderNested(value){
 if(primitive(value)){const span=document.createElement('span');span.textContent=value==null?'':String(value);return span}
 if(Array.isArray(value)){const list=document.createElement('ul');list.className='nested-list';value.forEach(entry=>{const item=document.createElement('li');item.append(renderNested(entry));list.append(item)});return list}
 const group=document.createElement('div');group.className='nested-group';Object.entries(value).forEach(([key,nested])=>{const row=document.createElement('div');const label=document.createElement('div');label.className='nested-label';label.textContent=labelFor(key);row.append(label,renderNested(nested));group.append(row)});return group
}
function renderItems(items,card){
 if(!Array.isArray(items))return;const primitives=items.every(primitive);
 if(primitives){const list=document.createElement('ul');list.className='item-list';items.forEach(value=>{const item=document.createElement('li');item.textContent=value==null?'':String(value);list.append(item)});card.append(list);return}
 const definitions=document.createElement('dl');items.forEach((item,index)=>{if(primitive(item)){const row=document.createElement('div');row.className='definition';const term=document.createElement('dt');term.textContent=`Item ${index+1}`;const desc=document.createElement('dd');desc.textContent=String(item??'');row.append(term,desc);definitions.append(row);return}Object.entries(item).forEach(([key,value])=>{const row=document.createElement('div');row.className='definition';const term=document.createElement('dt');term.textContent=labelFor(key);const desc=document.createElement('dd');desc.append(renderNested(value));row.append(term,desc);definitions.append(row)})});card.append(definitions)
}
function renderSections(sections){const root=document.getElementById('sections');root.replaceChildren();sections.forEach(section=>{const card=document.createElement('article');card.className='grammar-card';const title=document.createElement('h2');title.textContent=String(section.title||'Grammar section');card.append(title);if(section.introduction){const intro=document.createElement('p');intro.className='intro';intro.textContent=String(section.introduction);card.append(intro)}renderItems(section.items,card);if(section.important_note){const note=document.createElement('p');note.className='note';note.textContent=String(section.important_note);card.append(note)}root.append(card)})}
async function loadGrammar(){const state=document.getElementById('state');try{const response=await fetch('/api/v1/library/grammar');if(!response.ok)throw new Error('unavailable');const data=await response.json();const sections=Array.isArray(data.sections)?data.sections:[];if(!sections.length){state.textContent='No grammar sections are available yet.';return}state.hidden=true;renderSections(sections)}catch(error){state.textContent='Grammar is unavailable — is the local server running?'}}loadGrammar();
</script></body></html>
